# 偵錯環境設定，docker compose 與 VS F5 都會自動與 docker-compose.yml 合併。
services:
  api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${APP_DB_NAME:-konbini};Username=${APP_DB_USER:-konbini};Password=${APP_DB_PASSWORD:?請在 .env 設定 APP_DB_PASSWORD}
      - Jwt__Secret=${JWT_SECRET:?請在 .env 設定 JWT_SECRET}
    ports:
      # 對外固定 5214，讓 vite proxy（→ 127.0.0.1:5214）不論 API 在容器內外都通。
      # 只綁本機：不綁 IP 時會開在所有網卡，同網段的人也連得到
      - "127.0.0.1:5214:8080"

  postgres:
    ports:
      - "127.0.0.1:5432:5432"
