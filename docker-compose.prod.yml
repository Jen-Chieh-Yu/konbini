# 部署環境：client（nginx，唯一對外入口）+ api（不映射主機埠）+ postgres（不對外）
# + mailpit（收信，不寄真實信件；收信畫面只綁部署機本機）。
# 本專案不正式上線：此檔用於部署「演練」與完整佈局驗證，
# 故不設備份排程、監控與自動部署（決策見 CLAUDE.md §6）。
# 本機演練：docker compose -f docker-compose.prod.yml up -d --build（映像標籤 0.0.0-local）
# 部署發行版：docker load 發行成品後，.env 設 APP_VERSION，再 up -d --no-build（docs/deployment.md）

# 獨立專案名：不設的話會沿用資料夾名 konbini，與開發環境（docker-compose.yml 的
# name: konbini）視為同一個專案，共用 pg-data volume、互相覆蓋容器
name: konbini-prod

# 共用設定：json-file 預設不輪替，長期執行會塞滿磁碟
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  client:
    # 映像標籤＝版號：部署時用 docker load 進來的發行版映像；本機 --build 時為 0.0.0-local
    image: konbini-client:${APP_VERSION:-0.0.0-local}
    build:
      context: ./src/Konbini.Client
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0-local}
    container_name: konbini-prod-client
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  api:
    image: konbini-api:${APP_VERSION:-0.0.0-local}
    build:
      context: .
      dockerfile: src/Konbini.Api/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0-local}
    container_name: konbini-prod-api
    restart: unless-stopped
    logging: *default-logging
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # compose 的 .env 只做 ${} 替換，要進容器的鍵必須在此明寫（.NET 設定鍵用 __ 雙底線）
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${APP_DB_NAME:-konbini};Username=${APP_DB_USER:-konbini};Password=${APP_DB_PASSWORD:?請在 .env 設定 APP_DB_PASSWORD}
      Jwt__Secret: ${JWT_SECRET:?請在 .env 設定 JWT_SECRET}
    expose:
      - "8080"
    healthcheck:
      # aspnet 映像無 curl/wget，以 bash 的 /dev/tcp 打 /health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    container_name: konbini-prod-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請在 .env 設定 POSTGRES_PASSWORD}
      # 應用程式帳號與資料庫：由 init 腳本建立（POSTGRES_USER 是超級使用者，應用程式不使用）
      APP_DB_NAME: ${APP_DB_NAME:-konbini}
      APP_DB_USER: ${APP_DB_USER:-konbini}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?請在 .env 設定 APP_DB_PASSWORD}
    healthcheck:
      # -h 127.0.0.1 強制走 TCP：首次初始化時映像先起一個只開 socket 的暫時伺服器，
      # 用 socket 檢查會在 init 腳本跑完前就誤判健康
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    volumes:
      # postgres 18 起資料目錄為 /var/lib/postgresql/<主版本>/docker，volume 掛在上一層
      - pg-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

  mailpit:
    # 部署演練也不寄真實信件：專案不正式上線，沒有真的收信對象（CLAUDE.md §4）
    image: axllent/mailpit:v1
    container_name: konbini-prod-mailpit
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    # SMTP 只在 compose 內部網路
    expose:
      - "1025"
    ports:
      # 收信畫面只綁部署機本機，其他機器連不到；用 8026 避開開發環境的 8025，兩套才能同時執行
      - "127.0.0.1:8026:8025"

volumes:
  pg-data:
