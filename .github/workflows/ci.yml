name: CI

# Actions 執行清單的顯示名稱：PR 的執行帶「PR #編號：」前綴，
# 其他事件（push、標籤）留空字串 → 沿用預設（commit 訊息首行；
# 合併 commit 會自然顯示「Merge pull request #N from …」，等同 Azure 的 Merged PR 標註）
run-name: "${{ github.event_name == 'pull_request' && format('PR #{0}：{1}', github.event.pull_request.number, github.event.pull_request.title) || '' }}"

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'refactor/**', 'docs/**', 'chore/**', 'hotfix/**']
    tags: ['v*']
    # 文件不觸發建置：*.md 與 docs/（含 mockups 的 HTML 草稿）
    paths-ignore: ['**/*.md', 'docs/**']
  # PR 不設 paths-ignore：讓每個 PR 一律回報檢查結果——
  # 之後開 branch protection 的必過檢查，才不會被純 .md 的 PR 永遠等不到而卡住
  pull_request:
    branches: [main]
  # 手動觸發：Actions 頁面出現「Run workflow」按鈕，可指定分支或標籤執行。
  # 勾選「測試打包」時，在任何分支跑完整的打包與冒煙測試（版號 0.0.0-test.<編號>），
  # 不必在分支上打 v* 標籤——已推送的標籤原則上不刪，會跟正式版號混在一起
  workflow_dispatch:
    inputs:
      test_package:
        description: '測試打包（任何分支；版號 0.0.0-test.<編號>，成品只能用於測試）'
        type: boolean
        default: false

# 預設只讀；建立 Release 的 job 另外提高權限
permissions:
  contents: read

# 同一分支的連續推送只跑最新一次，舊的自動取消
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 後端：建置與單元測試
    runs-on: ubuntu-latest
    steps:
      - name: ① 取出原始碼
        uses: actions/checkout@v7
      # SDK 版本由根目錄 global.json 決定，本機與 CI 同一份設定；升版只改 global.json
      - name: ② 安裝 .NET SDK（依 global.json）
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # 指定專案路徑：只建 Api（測試專案由步驟④建），不建方案檔裡的 dcproj 與網站節點
      # shell: bash 讓指令帶 pipefail 執行——未指定 shell 時 GitHub 預設的 bash
      # 不帶 pipefail，dotnet build 失敗會被 tee 的成功結束碼蓋掉、步驟誤判綠燈
      - name: ③ 建置（Release）
        shell: bash
        run: dotnet build src/Konbini.Api -c Release | tee build.log
      - name: ④ 單元測試
        run: dotnet test tests/Konbini.Tests -c Release --logger "trx;LogFileName=test-results.trx" --results-directory TestResults
      # 測試失敗時上傳 trx 報告，可下載到本機用 Visual Studio 開啟排查
      - name: ④-1 上傳測試報告（僅失敗時）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          retention-days: 7

      # ---- 以下皆「僅提醒、不阻擋」：印在執行頁上方的 Annotations 與 Summary ----
      - name: ⑤ 編譯警告統計（僅提醒不阻擋）
        if: always()
        run: |
          count=$(grep -cE 'warning CS[0-9]+' build.log || true)
          if [ "${count:-0}" -gt 0 ]; then
            echo "::warning title=後端編譯警告::共 ${count} 個（分類統計見 Summary 與步驟⑤ log），僅提醒不阻擋"
            {
              echo "## 後端編譯警告：${count} 個"
              echo '```'
              grep -oE 'warning CS[0-9]+' build.log | sort | uniq -c | sort -rn
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## 後端編譯警告：0 個 ✅" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: ⑥ 套件弱點掃描（僅提醒不阻擋）
        if: always()
        run: |
          dotnet list src/Konbini.Api package --vulnerable --include-transitive | tee vuln.log || true
          # 只比對「有弱點」的句子：沒有弱點時的訊息「has no vulnerable packages」也含 vulnerable packages，
          # 只 grep 後半句會把「沒有弱點」誤判成有弱點
          if grep -q "has the following vulnerable packages" vuln.log; then
            echo "::warning title=NuGet 套件弱點::發現有已知弱點的套件，明細見 Summary 與步驟⑥ log"
            { echo "## NuGet 套件弱點"; echo '```'; cat vuln.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## NuGet 套件弱點：無 ✅" >> "$GITHUB_STEP_SUMMARY"
          fi

  frontend:
    name: 前端：型別檢查與打包
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Konbini.Client
    steps:
      - name: ① 取出原始碼
        uses: actions/checkout@v7
      # Node 版本由 .nvmrc 決定，本機（nvm／fnm）與 CI 同一份設定
      - name: ② 安裝 Node.js（依 .nvmrc）
        uses: actions/setup-node@v7
        with:
          node-version-file: src/Konbini.Client/.nvmrc
          cache: npm
          cache-dependency-path: src/Konbini.Client/package-lock.json
      - name: ③ 安裝套件（npm ci）
        run: npm ci
      # 型別錯誤零容忍（從第一天就是 0，直接阻擋，不走「僅提醒」）
      - name: ④ 型別檢查（零容忍，會阻擋）
        run: npx vue-tsc --noEmit
      - name: ⑤ 打包（vite build）
        run: npm run build
      # 與後端的 NuGet 弱點掃描對稱：僅提醒不阻擋
      - name: ⑥ 套件弱點掃描（僅提醒不阻擋）
        if: always()
        run: |
          if npm audit > audit.log 2>&1; then
            echo "## npm 套件弱點：無 ✅" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=npm 套件弱點::發現有已知弱點的套件，明細見 Summary 與本步驟 log"
            { echo "## npm 套件弱點"; echo '```'; cat audit.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          cat audit.log

  docker:
    name: 容器：驗證 Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: ① 取出原始碼
        uses: actions/checkout@v7
      # 建完即丟：只驗證 Dockerfile 在乾淨環境建得起來
      - name: ② 建置 api 映像
        run: docker build -f src/Konbini.Api/Dockerfile -t konbini-api:ci .
      - name: ③ 建置 client 映像
        run: docker build -t konbini-client:ci src/Konbini.Client

  # ═══ 以下只在打包建置執行：推 v* 標籤（正式發行），或手動執行並勾選「測試打包」═══
  # 半自動發行：CI 產出成品並驗證，部署由人執行（docs/deployment.md）。流程見 docs/release.md。
  release-info:
    name: 打包：決定版號
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.test_package)
    needs: [backend, frontend, docker]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      kind: ${{ steps.info.outputs.kind }}
      suffix: ${{ steps.info.outputs.suffix }}
    steps:
      # 完整歷史：要確認正式標籤是否已在 main 上
      - name: ① 取出原始碼（完整歷史）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: ② 決定版號與成品名稱（正式標籤須在 main 上）
        id: info
        run: bash .github/scripts/release-info.sh

  # 映像綁 CPU 架構：amd64 給 x86_64 機器（一般雲端 VM、Windows），
  # arm64 給 Apple Silicon（部署目標 M 系列 Mac）——matrix 各建一份並各自冒煙測試，
  # 部署時依機器架構下載對應成品。
  package:
    name: 打包：映像與冒煙測試（${{ matrix.arch }}）
    needs: release-info
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      APP_VERSION: ${{ needs.release-info.outputs.version }}
      SUFFIX: ${{ needs.release-info.outputs.suffix }}
    steps:
      - name: ① 取出原始碼
        uses: actions/checkout@v7
      # 版號與 commit 寫進後端組件（/api/version）與前端的 version.json；
      # 映像標籤＝版號，與 docker-compose.prod.yml 的 image: 對應
      - name: ② 建置版本映像
        run: |
          docker build -f src/Konbini.Api/Dockerfile \
            --build-arg APP_VERSION="$APP_VERSION" --build-arg GIT_SHA="${GITHUB_SHA::7}" \
            -t "konbini-api:$APP_VERSION" .
          docker build \
            --build-arg APP_VERSION="$APP_VERSION" --build-arg GIT_SHA="${GITHUB_SHA::7}" \
            -t "konbini-client:$APP_VERSION" src/Konbini.Client
      # 用剛建好的映像跑部署佈局（prod compose，--no-build），確認成品真的能動：
      # 三個容器都起得來且健康、首頁 200、/api 反代通、版號正確、種子資料已建立
      - name: ③ 冒煙測試（部署佈局）
        run: |
          printf '%s\n' \
            'POSTGRES_PASSWORD=ci-postgres-password' \
            'APP_DB_PASSWORD=ci-app-password' \
            'JWT_SECRET=ci-smoke-test-secret-at-least-32-characters' > .env
          docker compose -f docker-compose.prod.yml up -d --no-build --wait --wait-timeout 180
          curl -fsS -o /dev/null http://localhost:8080/
          api_version=$(curl -fsS http://localhost:8080/api/version | jq -r .version)
          web_version=$(curl -fsS http://localhost:8080/version.json | jq -r .version)
          products=$(curl -fsS http://localhost:8080/api/products | jq length)
          echo "後端版號：$api_version，前端版號：$web_version，商品數：$products"
          if [ "$api_version" != "$APP_VERSION" ] || [ "$web_version" != "$APP_VERSION" ]; then
            echo "::error::版號不符：預期 $APP_VERSION，後端 $api_version、前端 $web_version"
            exit 1
          fi
          if [ "$products" -le 0 ]; then
            echo "::error::/api/products 沒有資料，種子資料可能沒有建立"
            exit 1
          fi
      - name: ③-1 印出容器日誌（僅冒煙測試失敗時）
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color
      - name: ④ 封存映像（docker save）
        run: |
          docker save "konbini-api:$APP_VERSION"    | gzip > "konbini-api-$SUFFIX-${{ matrix.arch }}.tar.gz"
          docker save "konbini-client:$APP_VERSION" | gzip > "konbini-client-$SUFFIX-${{ matrix.arch }}.tar.gz"
      # 正式發行另外附在 Release 上（不會過期）；測試打包只留 7 天
      - name: ⑤ 上傳成品（Artifacts）
        uses: actions/upload-artifact@v7
        with:
          name: konbini-images-${{ env.SUFFIX }}-${{ matrix.arch }}
          path: konbini-*.tar.gz
          retention-days: ${{ needs.release-info.outputs.kind == 'release' && 30 || 7 }}

  # 只在正式發行：建立 Release「草稿」並附上兩種架構的映像。
  # 由人檢查內容後在網頁按 Publish——這是半自動發行的人工確認點
  release:
    name: 發行：建立 Release 草稿
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-info, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ needs.release-info.outputs.version }}
    steps:
      - name: ① 下載各架構的映像成品
        uses: actions/download-artifact@v8
        with:
          pattern: konbini-images-*
          merge-multiple: true
          path: dist
      # 版號含 - 字尾（例：0.2.0-rc.1）標為 pre-release
      - name: ② 建立 Release 草稿
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 重跑同一個標籤（例：手動觸發重新驗證）時 Release 已存在，不重建、不覆蓋
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::Release $GITHUB_REF_NAME 已存在，略過建立"
            exit 0
          fi
          prerelease=()
          [[ "$APP_VERSION" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft "${prerelease[@]}" \
            --title "$GITHUB_REF_NAME" \
            --notes "部署步驟見 docs/deployment.md；變更紀錄見 CHANGELOG.md。確認內容後再按 Publish release。" \
            --generate-notes
