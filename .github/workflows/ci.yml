name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'refactor/**', 'docs/**', 'chore/**', 'hotfix/**']
    tags: ['v*']
    paths-ignore: ['**/*.md']
  # PR 不設 paths-ignore：讓每個 PR 一律回報檢查結果——
  # 之後開 branch protection 的必過檢查，才不會被純 .md 的 PR 永遠等不到而卡住
  pull_request:
    branches: [main]

# 同一分支的連續推送只跑最新一次，舊的自動取消
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 後端：建置與單元測試
    runs-on: ubuntu-latest
    steps:
      - name: ① 取出原始碼
        uses: actions/checkout@v4
      - name: ② 安裝 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # dcproj 只有 Visual Studio 認得，不能裸建 sln——一律指定專案路徑
      # shell: bash 讓指令帶 pipefail 執行——未指定 shell 時 GitHub 預設的 bash
      # 不帶 pipefail，dotnet build 失敗會被 tee 的成功結束碼蓋掉、步驟誤判綠燈
      - name: ③ 建置（Release）
        shell: bash
        run: dotnet build src/Konbini.Api -c Release | tee build.log
      - name: ④ 單元測試
        run: dotnet test tests/Konbini.Tests -c Release --logger "trx;LogFileName=test-results.trx" --results-directory TestResults
      # 測試失敗時上傳 trx 報告，可下載到本機用 Visual Studio 開啟排查
      - name: ④-1 上傳測試報告（僅失敗時）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          retention-days: 7

      # ---- 以下皆「僅提醒、不阻擋」：印在執行頁上方的 Annotations 與 Summary ----
      - name: ⑤ 編譯警告統計（僅提醒不阻擋）
        if: always()
        run: |
          count=$(grep -cE 'warning CS[0-9]+' build.log || true)
          if [ "${count:-0}" -gt 0 ]; then
            echo "::warning title=後端編譯警告::共 ${count} 個（分類統計見 Summary 與步驟⑤ log），僅提醒不阻擋"
            {
              echo "## 後端編譯警告：${count} 個"
              echo '```'
              grep -oE 'warning CS[0-9]+' build.log | sort | uniq -c | sort -rn
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## 後端編譯警告：0 個 ✅" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: ⑥ 套件弱點掃描（僅提醒不阻擋）
        if: always()
        run: |
          dotnet list src/Konbini.Api package --vulnerable --include-transitive | tee vuln.log || true
          if grep -q "vulnerable packages" vuln.log; then
            echo "::warning title=NuGet 套件弱點::發現有已知弱點的套件，明細見 Summary 與步驟⑥ log"
            { echo "## NuGet 套件弱點"; echo '```'; cat vuln.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## NuGet 套件弱點：無 ✅" >> "$GITHUB_STEP_SUMMARY"
          fi

  frontend:
    name: 前端：型別檢查與打包
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Konbini.Client
    steps:
      - name: ① 取出原始碼
        uses: actions/checkout@v4
      - name: ② 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Konbini.Client/package-lock.json
      - name: ③ 安裝套件（npm ci）
        run: npm ci
      # 型別錯誤零容忍（從第一天就是 0，直接阻擋，不走「僅提醒」）
      - name: ④ 型別檢查（零容忍，會阻擋）
        run: npx vue-tsc --noEmit
      - name: ⑤ 打包（vite build）
        run: npm run build
      # 與後端的 NuGet 弱點掃描對稱：僅提醒不阻擋
      - name: ⑥ 套件弱點掃描（僅提醒不阻擋）
        if: always()
        run: |
          if npm audit > audit.log 2>&1; then
            echo "## npm 套件弱點：無 ✅" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=npm 套件弱點::發現有已知弱點的套件，明細見 Summary 與本步驟 log"
            { echo "## npm 套件弱點"; echo '```'; cat audit.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          cat audit.log

  docker:
    name: 容器：驗證 Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: ① 取出原始碼
        uses: actions/checkout@v4
      # 建完即丟：只驗證 Dockerfile 在乾淨環境建得起來
      - name: ② 建置 api 映像
        run: docker build -f src/Konbini.Api/Dockerfile -t konbini-api:ci .
      - name: ③ 建置 client 映像
        run: docker build -t konbini-client:ci src/Konbini.Client

  # 只在推送 v* 標籤時執行：產出可部署的映像封存（發行流程練習）。
  # 映像綁 CPU 架構：amd64 給 x86_64 機器（一般雲端 VM、Windows），
  # arm64 給 Apple Silicon（部署目標 M 系列 Mac）——matrix 各建一份，
  # 部署時依機器架構下載對應成品。
  package:
    name: 打包：產出映像成品（僅 v* 標籤，${{ matrix.arch }}）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend, docker]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: ① 取出原始碼
        uses: actions/checkout@v4
      - name: ② 建置版本映像
        run: |
          docker build -f src/Konbini.Api/Dockerfile -t "konbini-api:${GITHUB_REF_NAME}" .
          docker build -t "konbini-client:${GITHUB_REF_NAME}" src/Konbini.Client
      - name: ③ 封存映像（docker save）
        run: |
          docker save "konbini-api:${GITHUB_REF_NAME}"    | gzip > "konbini-api-${GITHUB_REF_NAME}-${{ matrix.arch }}.tar.gz"
          docker save "konbini-client:${GITHUB_REF_NAME}" | gzip > "konbini-client-${GITHUB_REF_NAME}-${{ matrix.arch }}.tar.gz"
      - name: ④ 上傳成品（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: konbini-images-${{ github.ref_name }}-${{ matrix.arch }}
          path: konbini-*.tar.gz
          retention-days: 30
